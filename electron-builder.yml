appId: dev.untypo.client
productName: UnTypo
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
compression: maximum
electronDist: node_modules/electron/dist
electronLanguages:
  - en-US
  - zh-CN
directories:
  buildResources: assets
  output: release
publish:
  provider: github
  owner: Nexaorion
  repo: UnTypo
  releaseType: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: assets/untypo-icon.ico
    to: untypo-icon.ico
  - from: build/Release/untypo_native_helper.exe
    to: bin/untypo_native_helper.exe
win:
  executableName: UnTypo
  icon: untypo-icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-${version}-${arch}.${ext}
