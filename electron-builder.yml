appId: dev.untypo.client
productName: UnTypo
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
compression: maximum
electronLanguages:
  - en-US
  - zh-CN
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: build/Release/untypo_native_helper.exe
    to: bin/untypo_native_helper.exe
win:
  executableName: UnTypo
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-${version}-${arch}.${ext}
