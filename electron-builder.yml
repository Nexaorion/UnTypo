appId: dev.untypo.client
productName: UnTypo
asar: true
compression: maximum
electronLanguages:
  - en-US
  - zh-CN
directories:
  output: release
files:
  - dist/**/*
  - package.json
win:
  executableName: UnTypo
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-${version}-${arch}.${ext}
