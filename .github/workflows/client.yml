name: Client

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-frontend:
    name: Verify frontend
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check

  publish-windows-release:
    name: Publish Windows release
    needs: verify-frontend
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/preview') &&
      github.repository == 'Nexaorion/UnTypo'
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: windows-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
      IS_PRERELEASE: ${{ github.ref == 'refs/heads/preview' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "package.json version '$version' is not a valid SemVer version"
          }
          $tag = "v$version"
          if ($env:RELEASE_BRANCH -eq 'preview') {
            $tag = "preview-$tag"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8NoBOM
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding utf8NoBOM

      - name: Confirm release commit is current branch head
        id: branch
        shell: pwsh
        run: |
          & git fetch origin $env:RELEASE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the $env:RELEASE_BRANCH branch" }
          $branchHead = (& git rev-parse "origin/$env:RELEASE_BRANCH").Trim()
          $isCurrent = $branchHead -eq $env:GITHUB_SHA
          if (-not $isCurrent) {
            Write-Host "Skipping release because $env:GITHUB_SHA is no longer the $env:RELEASE_BRANCH branch head"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "is_current=$($isCurrent.ToString().ToLowerInvariant())" -Encoding utf8NoBOM

      - name: Set up Node.js
        if: steps.branch.outputs.is_current == 'true'
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        if: steps.branch.outputs.is_current == 'true'
        run: npm ci

      - name: Ensure Electron distribution is available
        if: steps.branch.outputs.is_current == 'true'
        run: node node_modules/electron/install.js

      - name: Build Electron client and Native Helper
        if: steps.branch.outputs.is_current == 'true'
        run: npm run build

      - name: Create or update version tag
        if: steps.branch.outputs.is_current == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          & git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch remote tags' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git tag --force --annotate $env:RELEASE_TAG $env:GITHUB_SHA --message "Release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create or update tag $env:RELEASE_TAG" }
          & git push --force origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Unable to push tag $env:RELEASE_TAG" }

      - name: Create or reuse draft release
        if: steps.branch.outputs.is_current == 'true'
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseJson = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
          } elseif ($LASTEXITCODE -eq 1) {
            $arguments = @(
              'api', '--method', 'POST', "repos/$env:GITHUB_REPOSITORY/releases",
              '-f', "tag_name=$env:RELEASE_TAG",
              '-f', "target_commitish=$env:GITHUB_SHA",
              '-f', "name=$env:RELEASE_VERSION",
              '-F', 'draft=true'
            )
            if ($env:IS_PRERELEASE -eq 'true') {
              $arguments += @('-F', 'prerelease=true')
            }
            $release = (& gh @arguments) | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Unable to create draft release $env:RELEASE_TAG" }
          } else {
            throw "Unable to look up release $env:RELEASE_TAG"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "id=$($release.id)" -Encoding utf8NoBOM

      - name: Publish Windows installer and update metadata
        if: steps.branch.outputs.is_current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EP_GH_IGNORE_TIME: true
          EP_PRE_RELEASE: ${{ env.IS_PRERELEASE }}
        run: |
          $arguments = @('--win', 'nsis', '--publish', 'always')
          if ($env:IS_PRERELEASE -eq 'true') {
            $arguments += '--config.publish.tagNamePrefix=preview-v'
          }
          & .\node_modules\.bin\electron-builder.cmd @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the Windows installer' }

      - name: Publish release channel
        if: steps.branch.outputs.is_current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          $prerelease = if ($env:IS_PRERELEASE -eq 'true') { 'true' } else { 'false' }
          $arguments = @('api', '--method', 'PATCH', "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID", '-F', 'draft=false', '-F', "prerelease=$prerelease")
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish release ID $env:RELEASE_ID" }

      - name: Publish installer checksum
        if: steps.branch.outputs.is_current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $installers = Get-ChildItem -LiteralPath release -Filter *.exe -File
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          $hash = Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256
          Set-Content -LiteralPath release\SHA256SUMS.txt -Value "$($hash.Hash)  $($installers[0].Name)"
          & gh release upload $env:RELEASE_TAG release\SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish checksum for $env:RELEASE_TAG" }

      - name: Verify published release assets
        if: steps.branch.outputs.is_current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $release = & gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to load release ID $env:RELEASE_ID" }
          $expectedPrerelease = $env:IS_PRERELEASE -eq 'true'
          if ($release.draft -or ($release.prerelease -ne $expectedPrerelease)) {
            throw "Release ID $env:RELEASE_ID does not match the expected release channel"
          }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $requiredAssets = @(
            "UnTypo-$env:RELEASE_VERSION-x64.exe",
            "UnTypo-$env:RELEASE_VERSION-x64.exe.blockmap",
            'latest.yml',
            'SHA256SUMS.txt'
          )
          $missingAssets = @($requiredAssets | Where-Object { $_ -notin $assetNames })
          if ($missingAssets.Count -gt 0) {
            throw "Release ID $env:RELEASE_ID is missing required auto-update assets: $($missingAssets -join ', ')"
          }
