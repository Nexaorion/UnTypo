name: Client

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows-client:
    name: Verify Windows client
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci

      - name: Ensure Electron distribution is available
        run: node node_modules/electron/install.js

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Lint source
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run unit and provider contract tests
        run: npm run test

      - name: Build Electron client and Native Helper
        run: npm run build

      - name: Exercise authenticated Native Helper pipe
        run: node scripts/native-smoke.mjs

      - name: Exercise Electron isolation and UI interactions
        shell: pwsh
        run: '& .\node_modules\.bin\electron.cmd . --smoke-test'

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: '& .\node_modules\.bin\electron-builder.cmd --win nsis --publish never'

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem -LiteralPath release -Filter *.exe -File
          if ($installers.Count -eq 0) { throw 'No installer was produced' }
          $lines = $installers | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          }
          Set-Content -LiteralPath release\SHA256SUMS.txt -Value $lines

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: untypo-windows-unsigned
          path: |
            release/*.exe
            release/SHA256SUMS.txt

  publish-windows-release:
    name: Publish Windows release
    needs: verify-windows-client
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/preview') &&
      github.repository == 'Nexaorion/UnTypo'
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: windows-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
      IS_PRERELEASE: ${{ github.ref == 'refs/heads/preview' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "package.json version '$version' is not a valid SemVer version"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8NoBOM
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=v$version" -Encoding utf8NoBOM

      - name: Confirm release commit is current branch head
        id: branch
        shell: pwsh
        run: |
          & git fetch origin $env:RELEASE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the $env:RELEASE_BRANCH branch" }
          $branchHead = (& git rev-parse "origin/$env:RELEASE_BRANCH").Trim()
          $isCurrent = $branchHead -eq $env:GITHUB_SHA
          if (-not $isCurrent) {
            Write-Host "Skipping release because $env:GITHUB_SHA is no longer the $env:RELEASE_BRANCH branch head"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "is_current=$($isCurrent.ToString().ToLowerInvariant())" -Encoding utf8NoBOM

      - name: Set up Node.js
        if: steps.branch.outputs.is_current == 'true'
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        if: steps.branch.outputs.is_current == 'true'
        run: npm ci

      - name: Ensure Electron distribution is available
        if: steps.branch.outputs.is_current == 'true'
        run: node node_modules/electron/install.js

      - name: Build Electron client and Native Helper
        if: steps.branch.outputs.is_current == 'true'
        run: npm run build

      - name: Create or update version tag
        if: steps.branch.outputs.is_current == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          & git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch remote tags' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git tag --force --annotate $env:RELEASE_TAG $env:GITHUB_SHA --message "Release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create or update tag $env:RELEASE_TAG" }
          & git push --force origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Unable to push tag $env:RELEASE_TAG" }

      - name: Publish Windows installer and update metadata
        if: steps.branch.outputs.is_current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EP_GH_IGNORE_TIME: true
          EP_PRE_RELEASE: ${{ env.IS_PRERELEASE }}
        run: '& .\node_modules\.bin\electron-builder.cmd --win nsis --publish always'

      - name: Set release channel
        if: steps.branch.outputs.is_current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $arguments = @('release', 'edit', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--draft=false')
          if ($env:IS_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          } else {
            $arguments += '--prerelease=false'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Unable to set the release channel for $env:RELEASE_TAG" }

      - name: Publish installer checksum
        if: steps.branch.outputs.is_current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $installers = Get-ChildItem -LiteralPath release -Filter *.exe -File
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          $hash = Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256
          Set-Content -LiteralPath release\SHA256SUMS.txt -Value "$($hash.Hash)  $($installers[0].Name)"
          & gh release upload $env:RELEASE_TAG release\SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish checksum for $env:RELEASE_TAG" }

      - name: Verify published release assets
        if: steps.branch.outputs.is_current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $release = & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to load release $env:RELEASE_TAG" }
          $expectedPrerelease = $env:IS_PRERELEASE -eq 'true'
          if ($release.isDraft -or ($release.isPrerelease -ne $expectedPrerelease)) {
            throw "Release $env:RELEASE_TAG does not match the expected release channel"
          }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $requiredAssets = @(
            "UnTypo-$env:RELEASE_VERSION-x64.exe",
            "UnTypo-$env:RELEASE_VERSION-x64.exe.blockmap",
            'latest.yml',
            'SHA256SUMS.txt'
          )
          $missingAssets = @($requiredAssets | Where-Object { $_ -notin $assetNames })
          if ($missingAssets.Count -gt 0) {
            throw "Release $env:RELEASE_TAG is missing required auto-update assets: $($missingAssets -join ', ')"
          }
